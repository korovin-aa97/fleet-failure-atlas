<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Fleet Failure Atlas</title>
  <desc id="desc">Turn an autonomous coding-agent failure pattern into a safe reproduction, a clear detector, and a regression guard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0818"/>
      <stop offset="0.52" stop-color="#1a1030"/>
      <stop offset="1" stop-color="#2b1745"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="guard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#35204f"/>
      <stop offset="1" stop-color="#28193f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#03040c" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="28" fill="url(#background)"/>
  <circle cx="1125" cy="78" r="230" fill="#7c3aed" opacity="0.15"/>
  <circle cx="1195" cy="580" r="280" fill="#a78bfa" opacity="0.08"/>
  <circle cx="95" cy="620" r="220" fill="#c084fc" opacity="0.07"/>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, sans-serif">
    <text x="72" y="92" fill="url(#accent)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700" letter-spacing="4">REPRODUCE · DETECT · PREVENT</text>
    <text x="72" y="198" fill="#f8f7ff" font-size="76" font-weight="820" letter-spacing="-3">Fleet Failure Atlas</text>
    <text x="72" y="254" fill="#c9c4dc" font-size="31">Turn agent failures into repeatable tests—and keep them fixed.</text>

    <g filter="url(#shadow)">
      <rect x="72" y="350" width="244" height="128" rx="20" fill="#2a173d" stroke="#c084fc" stroke-width="2"/>
      <circle cx="108" cy="386" r="16" fill="#c084fc"/>
      <path d="M108 376V389M108 397V398" stroke="#29162f" stroke-width="4" stroke-linecap="round"/>
      <text x="216" y="393" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="750">FAILURE PATTERN</text>
      <text x="100" y="442" fill="#c9c4dc" font-size="20">name the symptom</text>

      <path d="M316 414H352" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <path d="M342 403L356 414L342 425" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="356" y="350" width="244" height="128" rx="20" fill="#251c43" stroke="#a78bfa" stroke-width="2"/>
      <circle cx="392" cy="386" r="16" fill="#a78bfa"/>
      <path d="M385 386L390 391L400 381" fill="none" stroke="#251c43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="502" y="394" text-anchor="middle" fill="#ede9fe" font-size="17" font-weight="750">REPRODUCE</text>
      <text x="384" y="442" fill="#c9c4dc" font-size="20">run a safe fixture</text>

      <path d="M600 414H636" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <path d="M626 403L640 414L626 425" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="640" y="350" width="244" height="128" rx="20" fill="#22183c" stroke="#8b5cf6" stroke-width="2"/>
      <circle cx="676" cy="386" r="16" fill="#8b5cf6"/>
      <circle cx="673" cy="383" r="6" fill="none" stroke="#22183c" stroke-width="3"/>
      <path d="M678 388L684 394" stroke="#22183c" stroke-width="3" stroke-linecap="round"/>
      <text x="786" y="394" text-anchor="middle" fill="#ede9fe" font-size="17" font-weight="750">DETECT</text>
      <text x="668" y="442" fill="#c9c4dc" font-size="20">prove the signal</text>

      <path d="M884 414H920" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
      <path d="M910 403L924 414L910 425" fill="none" stroke="#a78bfa" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="924" y="350" width="284" height="128" rx="20" fill="url(#guard)" stroke="#a78bfa" stroke-width="2"/>
      <path d="M960 370L977 378V390C977 402 969 410 960 414C951 410 943 402 943 390V378Z" fill="#a78bfa"/>
      <path d="M951 391L957 397L969 384" fill="none" stroke="#35204f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1092" y="393" text-anchor="middle" fill="#f3e8ff" font-size="17" font-weight="750">REGRESSION GUARD</text>
      <text x="952" y="442" fill="#c9c4dc" font-size="20">keep the fix working</text>
    </g>

    <text x="72" y="568" fill="#9d96b5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21" letter-spacing="2">OPEN SOURCE · OFFLINE · SYNTHETIC EVIDENCE</text>
  </g>
</svg>
